name: 🐛 回報 bug
description: 有東西壞掉了？讓語喵來抓蟲
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        喵～謝謝你來回報 ฅ^•ω•^ฅ
        資訊越完整，語喵就越快找到原因。**送出前請確認內容沒有 Token、API key、`session.json`、`config.yaml` 或聊天內容。**
  - type: textarea
    id: what-happened
    attributes:
      label: 發生什麼事
      description: 實際看到的狀況，錯誤訊息可以直接貼上。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      placeholder: |
        1. 啟動 ...
        2. 在群組傳送 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果
      description: 原本應該發生什麼？
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: 例如 v1.2.0 或 commit 前 7 碼
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 執行環境
      value: |
        - OS：
        - Node.js：
        - LINE.js 版本／commit：
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相關 log
      description: 請先去掉 Token、金鑰、聊天室 ID 與訊息內容。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 送出前確認
      options:
        - label: 我已搜尋過現有 issue，沒有找到重複的回報。
          required: true
        - label: 我確認內容沒有 Token、API key、session、設定檔或其他人的聊天內容。
          required: true
