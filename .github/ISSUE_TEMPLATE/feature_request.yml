name: ✨ 功能建議
description: 想要新功能或改進？說給語喵聽聽
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        有好點子？語喵的耳朵豎起來了 🐾
        先講清楚要解決什麼問題，比直接給解法更有幫助喔。
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 現在哪裡不方便？在什麼情境下遇到的？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 想像中的做法
      description: 希望它怎麼運作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的其他方案
      description: 目前有沒有替代做法？為什麼不夠好？
  - type: textarea
    id: context
    attributes:
      label: 補充資訊
      description: 截圖、參考連結或其他背景都可以放這裡（記得去掉敏感資訊）。
